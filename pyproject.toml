[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "glassbox"
version = "0.1.0"
description = "Glassbox: explainable credit-risk model and loan decision app (Home Credit data)"
readme = "README.md"
requires-python = ">=3.12"
# Exact pins on purpose: this is an app, not a library. The saved model is a
# pickle, and pickles are only safe to load with the same library versions
# that created them.
dependencies = [
    "pandas==3.0.6",
    "numpy==2.5.3",
    "scikit-learn==1.9.1",
    "lightgbm==4.7.0",
    "shap==0.53.0",
    "matplotlib==3.11.2",
    "pyarrow==26.0.0",
    "joblib==1.6.0",
    "fastapi==0.143.0",
    "pydantic==2.14.0",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",  # required by FastAPI's TestClient
    "jupyterlab==4.6.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # lets tests import the top-level `api` package (added in M1)
