name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported Python, resolved from the version ranges in pyproject.toml.
          - python: "3.11"
            install: pip install -e ".[dev]"
          # The exact versions behind the published results.
          - python: "3.13"
            install: pip install -e ".[dev]" -c constraints.txt
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: python -m ${{ matrix.install }}

      - name: Run tests (synthetic data only; no Kaggle download needed)
        run: python -m pytest -v

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ruff
        run: python -m pip install "ruff==0.17.0"

      - name: Lint
        run: ruff check .

  web:
    name: web app (type-check + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run build

  demo:
    name: demo end to end (synthetic model, one server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: python -m pip install -e . -c constraints.txt

      - name: Train the demo model on synthetic applicants
        run: python -m credit_risk.demo

      - name: Build the web app
        run: cd web && npm ci && npm run build

      - name: Serve API and web app, then check them
        env:
          GLASSBOX_ARTIFACTS_DIR: artifacts/demo
        run: |
          uvicorn api.serve:app --port 8000 &
          curl --silent --fail --retry 20 --retry-all-errors --retry-delay 1 http://localhost:8000/api/health
          curl --silent --fail http://localhost:8000/api/model/info | python -c "import json, sys; assert json.load(sys.stdin)['dataset'] == 'synthetic-demo'"
          curl --silent --fail -X POST http://localhost:8000/api/predict -H 'Content-Type: application/json' \
            -d '{"applicant": {"amt_credit": 675000, "amt_annuity": 32800, "amt_goods_price": 607500,
                 "contract_type": "Cash loans", "amt_income_total": 157500, "income_type": "Working",
                 "education_type": "Secondary / secondary special", "years_employed": 3.5,
                 "ext_source_1": null, "ext_source_2": 0.48, "ext_source_3": 0.45, "own_car": false,
                 "own_realty": true, "cnt_children": 1, "region_rating": 2}}' \
            | python -c "import json, sys; body = json.load(sys.stdin); assert body['reasons_up'] or body['reasons_down']"
          curl --silent --fail http://localhost:8000/portfolio | grep -q '<div id="root">'

  docker:
    name: docker image (build + smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t glassbox .

      - name: Run and check
        run: |
          docker run --detach --publish 8000:8000 --name glassbox glassbox
          # --retry-all-errors: Docker's port forwarder accepts connections (then resets them)
          # before the app inside is listening, which --retry-connrefused alone doesn't cover.
          curl --silent --fail --retry 30 --retry-all-errors --retry-delay 2 http://localhost:8000/api/health
          curl --silent --fail http://localhost:8000/assess | grep -q '<div id="root">'

      - name: Container logs
        if: always()
        run: docker logs glassbox
